# Bubble Craps Machine Configuration

# Trigger settings
trigger:
  mode: "timer"              # "timer" or "remote"
  timer_interval_sec: 120    # seconds between rolls in timer mode

# Motor settings
motor:
  can_channel: "can0"        # socketcan interface name
  can_id: 0x141              # CAN arbitration ID for the motor (motor index 0)
  torque_scale_factor: 645           # "Taylor factor" — changes per motor model
  roll_rpm_min: 450           # minimum motor speed during rolling phase
  roll_rpm_max: 550           # maximum motor speed during rolling phase
  roll_duration_min_sec: 3   # minimum motor run time
  roll_duration_max_sec: 5   # maximum motor run time
  park_position: 294.29           # motor position for capture (degrees)
  park_speed_limit: 100      # RPM limit when moving to park position
  park_timeout_sec: 5        # max time to wait for motor to reach park position
  park_poll_interval_sec: 0.1  # how often to poll is_at_position()
  settling_time_sec: 2       # time to wait after park position is reached

# Camera settings
camera:
  resolution: [1920, 1080]
  exposure_mode: "fixed"
  exposure_time_us: 9500        # calibrated under ring light (auto chose ~9500)
  white_balance: "fixed"
  colour_gain_red: 3.16         # calibrated under ring light
  colour_gain_blue: 1.49        # calibrated under ring light

# Ring light settings
ring_light:
  gpio_pin: 13               # GPIO pin for NeoPixel data (physical pin 33)
  num_leds: 24               # number of LEDs on the ring
  idle_brightness: 0.3

# MQTT settings
mqtt:
  broker: "192.168.1.100"
  port: 1883
  client_id: "bubble-craps-01"
  keepalive: 60
  offline_queue:
    max_size: 100
    persist_file: "pending_rolls.json"

# Detection settings
detection:
  # Physical setup — set during calibration
  max_retries: 1
  calibration_file: "calibration.json"
  position_tolerance_px: 20
  roi_center_x: 0               # 0 = auto (image center)
  roi_center_y: 0               # 0 = auto (image center)
  roi_radius: 650               # ROI circle radius in pixels
  die_size_px: 305              # die face width in pixels
  pip_diameter_warped_px: 25    # pip diameter in the 200px perspective-corrected die image
  # Pipeline tuning — adjust if detection is unreliable
  threshold: 160                # brightness cutoff for white dice (calibrated at 9500us exposure)
  morph_kernel: 15              # morphology cleanup kernel size
  die_area_tolerance_low: 0.85  # min die size as fraction of die_size_px
  die_area_tolerance_high: 1.1  # max die size as fraction of die_size_px
  pip_area_tolerance_low: 0.6   # min pip size as fraction of expected
  pip_area_tolerance_high: 1.6  # max pip size as fraction of expected
  max_aspect_ratio: 1.4         # max width/height ratio for a square
  min_extent: 0.65              # min fill of bounding box
  min_circularity: 0.2          # min roundness for pip blobs
  min_convexity: 0.2            # min convexity for pip blobs
